name: Probe DG sources

# Eenmalige verkenning van openbare bronnen voor gevaarlijke-stoffengegevens.
# De ontwikkelomgeving heeft geen uitgaand netwerk, een runner wel. Deze
# workflow haalt niets binnen dat in de repo terechtkomt: zij kijkt of een bron
# bestaat en of die machinaal te lezen is, en zet de uitkomst in het draailog.
# Zie scripts/probe_dg_sources.py voor wat er precies gevraagd wordt.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Welke bron verkennen"
        type: choice
        options: [all, cantell, model-regs, cepa, dgl, dgl-survey, dgl-trial]
        default: all
      sample_pages:
        description: "Pagina's van de Dangerous Goods List als voorbeeld in het log"
        default: "60,61,120"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pymupdf

      - name: Probe
        if: ${{ inputs.source != 'dgl-survey' }}
        run: python scripts/probe_dg_sources.py "${{ inputs.source }}" --sample-pages "${{ inputs.sample_pages }}"

      - name: Survey the Dangerous Goods List
        if: ${{ inputs.source == 'dgl-survey' }}
        run: python scripts/survey_imdg_dgl.py --sample-pages "${{ inputs.sample_pages }}"

      # Een proef op een handvol pagina's voordat de hele lijst wordt gelezen:
      # de gedetecteerde kolomgrenzen en de uitkomst per stof zijn dan nog na
      # te lopen. Legt niets vast.
      - name: Trial run on a few pages
        if: ${{ inputs.source == 'dgl-trial' }}
        run: python scripts/extract_imdg_dgl.py --dry-run --pages "${{ inputs.sample_pages }}"
