name: Read IMDG special provisions

# Column 6 of the Dangerous Goods List is the last thing chapter 5.2's sea
# answer says it has not read. IMDG 5.2.2.1.2 lets a special provision add a
# subsidiary label where column 4 shows none and remove one where it does, and
# 5.2.2.1.2.1 lets one drop the labelling altogether. Two hundred and sixty-two
# provision numbers appear in that column; this finds the ones that touch
# labels, so a human can decide what the fact is.
#
# It commits nothing. Only the values a human reads out of the run log enter
# the repository, through a reviewed change, in the manner docs/data-sources.md
# promises.

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Print every provision of chapter 3.3, not only the ones about labels"
        type: boolean
        default: false
      number:
        description: "Extra provision numbers to print in full, comma separated (e.g. 63,172,251)"
        default: ""
        required: false
      chars:
        description: "How much of each provision to print"
        default: "900"
        required: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pymupdf

      # The same cache the other readers keep: the Code is 19 MB and the
      # publisher rate-limits.
      - name: Volumes already fetched
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cargopilot-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      - name: Read chapter 3.3
        env:
          ALL: ${{ inputs.all }}
          NUMBERS: ${{ inputs.number }}
          CHARS: ${{ inputs.chars }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$ALL" = "true" ]; then ARGS+=(--all); fi
          if [ -n "$CHARS" ]; then
            ARGS+=(--chars "$(echo "$CHARS" | tr -d '[:space:]')")
          fi
          if [ -n "$NUMBERS" ]; then
            IFS=',' read -ra WANTED <<< "$NUMBERS"
            for n in "${WANTED[@]}"; do
              ARGS+=(--number "$(echo "$n" | tr -d '[:space:]')")
            done
          fi
          python scripts/read_imdg_special_provisions.py "${ARGS[@]}"
