name: Probe NHM sources

# A survey of public sources for the NHM goods codes (CIM box 24). Records
# nothing: it measures whether a source is reachable, whether it supplies
# six-digit codes *with* a description, and whether that is enough to build a
# dropdown. Inventing six-digit codes is not an option here — the carrier
# calculates its tariff with it and customs read it.
#
# Runs here and not locally because the development environment has no outbound
# network. See scripts/probe_nhm_sources.py.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Eén eigen bron beproeven in plaats van de kandidatenlijst"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            python scripts/probe_nhm_sources.py --url "${{ inputs.url }}"
          else
            python scripts/probe_nhm_sources.py
          fi
