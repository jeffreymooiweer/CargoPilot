name: Scratch read article

# Temporary. The development container cannot reach medium.com; a runner can.
# Delete this together with scripts/_scratch_read_article.py once the article
# has been read — neither belongs in a release.

# A dispatch input needs the workflow to exist on the default branch, and this
# one deliberately never gets there. It runs on push instead.
on:
  push:
    paths:
      - .github/workflows/_scratch-read-article.yml
      - scripts/_scratch_read_article.py

env:
  ARTICLE: "https://medium.com/design-bootcamp/designing-user-friendly-data-tables-for-mobile-devices-c470c82403ad"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow
      - run: python scripts/_scratch_read_article.py "$ARTICLE"
