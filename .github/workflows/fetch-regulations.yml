name: Fetch regulations into the store

# Fill the document store from the register in backend/seed/dg/sources.json and
# keep the volumes in the Actions cache, where the reading and extraction
# workflows already look. The development container often cannot reach the
# publishers (UNECE refuses non-browser requests and the proxy blocks the rest);
# a runner can, and once a volume is in the cache every later run starts warm.
#
# Nothing is committed and nothing is published: the cache is repository-
# internal storage, the documents stay out of git, and the only thing that may
# change in the repository is a pinned sha256 in sources.json — which is a fact
# about a file, not the file.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Document ids to fetch (space separated); empty means everything fetchable"
        default: ""
        required: false
      probe_url:
        description: "Fetch these URLs (space separated) and print what they answer, instead of fetching documents. The development container's proxy blocks most hosts; the runner does not, so this is how a mirror or share page gets looked at."
        default: ""
        required: false
      drive_folder:
        description: "Download a public Google Drive folder into the store's incoming directory and adopt what is recognised"
        default: ""
        required: false
      adopt_as:
        description: "Mappings for unrecognised incoming files, one per line: filename.pdf=document-id"
        default: ""
        required: false
      find_instructions:
        description: "Report where the four-page model of 5.4.3 sits in these stored documents (ids, space separated)"
        default: ""
        required: false
      verify_instructions:
        description: "Cut every registered model of 5.4.3 out of the store and print what came out"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: /tmp/cargopilot-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      - name: Look at a URL
        if: ${{ inputs.probe_url != '' }}
        env:
          URL: ${{ inputs.probe_url }}
        run: |
          set -uo pipefail
          # The publishers answer a bare request with 403 — measured on
          # unece.org, which is behind Cloudflare. The reader's ladder starts
          # with browser headers for that reason, so the probe starts there too.
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for URL in $URL; do
          echo "############ $URL"
          echo "=== headers ==="
          curl -sS -L -A "$UA" -H "Accept: text/html,application/pdf,*/*" -I "$URL" || true
          curl -sS -L -A "$UA" -H "Accept: text/html,application/pdf,*/*" "$URL" -o /tmp/probe.bin || true
          if file /tmp/probe.bin | grep -qi 'html\|text'; then
            # A landing page is asked for because of what it links to. Printing
            # two thousand bytes of it says nothing: the links are the answer.
            echo "=== links to documents ==="
            grep -o 'href="[^"]*"' /tmp/probe.bin \
              | grep -iE '\.pdf|\.docx?' | sort -u | head -80 || true
            echo "=== headings ==="
            grep -o '<title>[^<]*</title>' /tmp/probe.bin | head -3 || true
          else
            echo "=== body, first 2000 bytes (binary) ==="
            ls -l /tmp/probe.bin
            head -c 2000 /tmp/probe.bin | od -c | head -20 || true
          fi
          done

      - name: Take in a Drive folder
        if: ${{ inputs.drive_folder != '' }}
        env:
          FOLDER: ${{ inputs.drive_folder }}
          ADOPT_AS: ${{ inputs.adopt_as }}
        run: |
          set -euo pipefail
          pip install --quiet gdown
          mkdir -p /tmp/cargopilot-regulations/incoming
          gdown --folder "$FOLDER" -O /tmp/cargopilot-regulations/incoming
          echo "=== incoming ==="
          ls -la /tmp/cargopilot-regulations/incoming
          # One mapping per line, not per word: the files an operator uploads
          # are named "ADR 2025 French.pdf" as often as not, and splitting the
          # input on spaces would cut such a name in three.
          printf '%s\n' "$ADOPT_AS" > /tmp/adopt-as.txt
          python scripts/regulations_store.py adopt \
            /tmp/cargopilot-regulations/incoming --map-file /tmp/adopt-as.txt

      - name: Where the instructions model sits
        if: ${{ inputs.find_instructions != '' }}
        env:
          IDS: ${{ inputs.find_instructions }}
        run: |
          set -euo pipefail
          pip install --quiet pymupdf
          python scripts/regulations_store.py path $IDS > /tmp/paths.txt || true
          cat /tmp/paths.txt
          xargs -r python scripts/find_instructions_pages.py < /tmp/paths.txt

      - name: Cut every model of 5.4.3 and look at it
        if: ${{ inputs.verify_instructions }}
        run: |
          set -euo pipefail
          pip install --quiet pymupdf
          python scripts/check_instruction_models.py

      - name: Fetch what is missing
        if: ${{ inputs.probe_url == '' && inputs.drive_folder == '' && inputs.find_instructions == '' && !inputs.verify_instructions }}
        run: python scripts/regulations_store.py fetch ${{ inputs.ids }}

      # Not after a page-range measurement: that report is what the run is for,
      # and a store listing under it only pushes it out of reach of a log tail.
      - name: Report the store
        if: ${{ always() && inputs.probe_url == '' && inputs.find_instructions == '' && !inputs.verify_instructions }}
        env:
          IGNORED: report runs after fetch and after adopt alike
        run: python scripts/regulations_store.py status || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/cargopilot-regulations
          key: regulations-${{ github.run_id }}
