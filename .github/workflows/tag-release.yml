name: Tag release

# Maakt de release-tag aan op main en publiceert de GitHub Release.
# Nodig omdat tags die binnen een workflow met GITHUB_TOKEN worden gepusht
# geen nieuwe tag-workflows triggeren; deze workflow doet daarom zelf de
# release en start de CI (Docker-build) expliciet op de tag-ref.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versie zonder v-prefix (bijv. 1.2.0); moet overeenkomen met VERSION"
        required: true
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'agent/release-v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ inputs.version }}"
            if [ "$RELEASE_VERSION" != "$FILE_VERSION" ]; then
              echo "::error::Input versie '$RELEASE_VERSION' komt niet overeen met VERSION ($FILE_VERSION)."
              exit 1
            fi
          else
            RELEASE_VERSION="$FILE_VERSION"
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            case "$HEAD_REF" in
              agent/release-v"$RELEASE_VERSION"*) ;;
              *)
                echo "::error::Releasebranch '$HEAD_REF' komt niet overeen met VERSION ($RELEASE_VERSION)."
                exit 1
                ;;
            esac
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG bestaat al lokaal/op remote — overslaan."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "CargoPilot $TAG"
            git push origin "$TAG"
          fi

      - name: Prepare release notes
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-body.md
          else
            python3 - "$VERSION" <<'PY' > release-body.md
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\n## Previous releases|\Z)"
          match = re.search(pattern, text, re.DOTALL)
          print(match.group(1).strip() if match else f"Release {version}. Zie CHANGELOG.md voor details.")
          PY
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al — overslaan."
          else
            gh release create "$TAG" --title "CargoPilot $TAG" --notes-file release-body.md
          fi

      - name: Trigger CI (Docker build) on tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dockerhub.yml --ref "${{ steps.release.outputs.tag }}"
