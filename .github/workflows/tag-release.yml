name: Tag release

# Maakt de release-tag aan op main en publiceert de GitHub Release.
# Nodig omdat tags die binnen een workflow met GITHUB_TOKEN worden gepusht
# geen nieuwe tag-workflows triggeren; deze workflow doet daarom zelf de
# release en start de CI (Docker-build) expliciet op de tag-ref.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versie zonder v-prefix (bijv. 1.2.0); moet overeenkomen met VERSION"
        required: true
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'agent/release-v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Releasen verandert main niet. Deze stap repareerde vroeger de versie in
      # package-lock.json met een commit naar main, en dat verschoof main onder
      # de volgende branch vandaan: die conflicteerde vervolgens op VERSION en
      # CHANGELOG.md en kon pas na een rebase worden gemerged. De controle zelf
      # is nu een poort in de CI van elke pull request, dus als hij hier faalt
      # is er iets gemerged dat rood had moeten staan — en dan is stoppen beter
      # dan repareren.
      - name: Verify the version files agree
        run: python scripts/check_versions.py

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ inputs.version }}"
            if [ "$RELEASE_VERSION" != "$FILE_VERSION" ]; then
              echo "::error::Input versie '$RELEASE_VERSION' komt niet overeen met VERSION ($FILE_VERSION)."
              exit 1
            fi
          else
            RELEASE_VERSION="$FILE_VERSION"
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            case "$HEAD_REF" in
              agent/release-v"$RELEASE_VERSION"*) ;;
              *)
                echo "::error::Releasebranch '$HEAD_REF' komt niet overeen met VERSION ($RELEASE_VERSION)."
                exit 1
                ;;
            esac
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG bestaat al lokaal/op remote — overslaan."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "CargoPilot $TAG"
            git push origin "$TAG"
          fi

      - name: Prepare release notes
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-body.md
          else
            python3 - "$VERSION" <<'PY' > release-body.md
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\n## Previous releases|\Z)"
          match = re.search(pattern, text, re.DOTALL)
          print(match.group(1).strip() if match else f"Release {version}. Zie CHANGELOG.md voor details.")
          PY
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al — overslaan."
          else
            gh release create "$TAG" --title "CargoPilot $TAG" --notes-file release-body.md
          fi

      # Hier stond: bouw de image nog een keer, nu op de tag-ref. Dat kostte vier
      # tot zes minuten om precies dezelfde commit nog eens te vertalen, plus de
      # testsuites er nog eens overheen. Main had die bits al gebouwd, getest en
      # gepusht onder zijn korte SHA.
      #
      # Een tag is geen build maar een naam. `imagetools create` zet die naam
      # server-side op het bestaande manifest — beide architecturen, in seconden,
      # zonder één laag over te halen. En het is strenger dan een herbouw: de
      # uitgebrachte image is bit voor bit de image die groen door de CI kwam,
      # in plaats van een tweede vertaling die er net naast kan zitten.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Name the image main already built
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: jeffersonmouze/cargopilot
        run: |
          SHORT="$(git rev-parse --short=7 HEAD)"
          echo "Looking for $IMAGE:$SHORT — the image built from this very commit."

          # De release wordt meestal binnen een minuut na de merge gestart en de
          # build op main duurt een paar minuten, dus even wachten hoort erbij.
          # Twintig minuten is ruim; daarna is er iets mis en is stoppen beter
          # dan een versietag op een image van gisteren.
          for attempt in $(seq 1 60); do
            if docker buildx imagetools inspect "$IMAGE:$SHORT" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$SHORT"
              echo "$IMAGE:$VERSION now points at the same manifest as $IMAGE:$SHORT."
              docker buildx imagetools inspect "$IMAGE:$VERSION"
              exit 0
            fi
            echo "  not there yet (attempt $attempt), waiting 20s"
            sleep 20
          done

          echo "::error::$IMAGE:$SHORT never appeared. The build on main either failed or never ran, so there is no tested image to release."
          exit 1
