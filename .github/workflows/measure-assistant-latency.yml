name: Measure assistant latency

# The hardware requirements the documentation states should be measured, not
# guessed. This workflow installs the exact pinned runtime a user would get —
# the llama.cpp server build and the Qwen3-1.7B Q8_0 model from
# backend/app/config/assistant_runtime.json — on a standard 4-vCPU runner,
# runs the assistant's two real extraction shapes against it, and prints the
# timings and memory to the log. The log is the deliverable; nothing is
# committed or stored.

on:
  workflow_dispatch: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned runtime, exactly as the app would
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib, json, pathlib, urllib.request
          config = json.loads(pathlib.Path("backend/app/config/assistant_runtime.json").read_text())
          for label, pin in (("server", config["server"]["x86_64"]), ("model", config["model"])):
              name = "server.tar.gz" if label == "server" else config["model"]["filename"]
              urllib.request.urlretrieve(pin["url"], name)
              digest = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              assert digest == pin["sha256"], f"{label}: {digest} != {pin['sha256']}"
              print(f"{label}: verified {name}")
          EOF
          mkdir -p bin && tar -xzf server.tar.gz --strip-components=1 -C bin
          nproc; free -m | head -2

      - name: Start the server and time the two extraction shapes
        run: |
          set -euo pipefail
          model=$(python3 -c "import json;print(json.load(open('backend/app/config/assistant_runtime.json'))['model']['filename'])")
          LD_LIBRARY_PATH=bin ./bin/llama-server -m "$model" --host 127.0.0.1 --port 8012 -c 4096 --no-webui --reasoning-budget 0 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8012/health >/dev/null && break; sleep 1
          done
          echo "MEASURE server ready after ${i}s"
          run_case () {
            local label="$1" system="$2" user="$3" schema="$4"
            python3 - "$label" "$system" "$user" "$schema" <<'PYEOF'
          import json, sys, time, urllib.request
          label, system, user, schema = sys.argv[1:5]
          payload = json.dumps({
              "messages": [{"role": "system", "content": json.loads(system)},
                           {"role": "user", "content": json.loads(user)}],
              "temperature": 0.1,
              "response_format": {"type": "json_schema",
                                  "json_schema": {"name": "extraction",
                                                  "schema": json.loads(schema)}},
          }).encode()
          start = time.monotonic()
          request = urllib.request.Request("http://127.0.0.1:8012/v1/chat/completions",
                                           payload, {"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=300) as response:
              content = json.load(response)["choices"][0]["message"]["content"]
          seconds = time.monotonic() - start
          print("  ->", content)
          print(f"MEASURE {label} seconds={seconds:.1f}")
          PYEOF
          }
          run_case goods_nl \
            '"You convert a shipper'"'"'s free-text message into structured goods lines. Extract every distinct goods item with its quantity and unit where stated. Copy the wording as given; do not translate, classify or guess."' \
            '"ik wil 1000 jerrycans diesel en 4 pallets kalkzandsteen laten vervoeren"' \
            '{"type":"object","properties":{"lines":{"type":"array","items":{"type":"object","properties":{"description":{"type":"string"},"quantity":{"type":"number"},"unit":{"type":"string"}},"required":["description"]}}},"required":["lines"]}'
          run_case choice_nl \
            '"The user answers a form question. Decide which of the allowed options their answer means. If unclear, answer unclear. Allowed options: packages (Colli), tank (Tank), bulk (Losgestort)."' \
            '"het gaat in een tankwagen"' \
            '{"type":"object","properties":{"choice":{"type":"string","enum":["packages","tank","bulk","unclear"]}},"required":["choice"]}'
          run_case intake_nl \
            '"You convert a shipper'"'"'s free-text message into structured consignment data. Extract every distinct goods item with its quantity and unit where stated, and any consignment details the message explicitly states: consignor (the sender), consignee (the receiver), carrier, loading point, discharge point, loading date, references. A goods description names the goods only - never the addresses, parties, dates or references, which belong in their own fields. Copy the wording as given; do not translate, classify, complete or guess, and omit every field the message does not state."' \
            '"1000 jerrycans diesel van Mooiweer BV, Kade 1 Rotterdam naar Afnemer GmbH in Duisburg, vervoerder Trans Janssen, order 4711"' \
            '{"type":"object","properties":{"lines":{"type":"array","items":{"type":"object","properties":{"description":{"type":"string"},"quantity":{"type":"number"},"unit":{"type":"string"}},"required":["description"]}},"consignor_name":{"type":"string"},"consignor_address":{"type":"string"},"consignee_name":{"type":"string"},"consignee_address":{"type":"string"},"carrier_name":{"type":"string"},"loading_point":{"type":"string"},"discharge_point":{"type":"string"},"loading_date":{"type":"string"},"shipment_reference":{"type":"string"},"booking_number":{"type":"string"},"purchase_order":{"type":"string"}},"required":["lines"]}'
          free -m | head -2
          echo "MEASURE rss_kb=$(ps -o rss= -C llama-server | awk '{s+=$1} END {print s}')"
