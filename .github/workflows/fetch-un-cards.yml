name: Fetch UN cards

# Downloads Cantell's IMDG UN cards once (2023 edition, IMDG 41-22), reads the UN
# number out of every document, renames each file to un_<number>.pdf and opens a
# pull request with the result.
#
# The source numbers its files part1, part2, … in ascending UN order, but the
# part number is not the UN number: part1 is UN 0004 and part2 is UN 0005. Each
# card states its own UN number under a "UN number" label and repeats it in the
# footer, and the script reads both.
#
# This runs here rather than locally because the runner has the internet access
# and the patience for ~2900 sequential downloads. Start with dry_run to check the
# URL pattern before committing anything.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL with {n} for the part number"
        required: true
        default: "https://www.cantell.dk/image/catalog/Stofliste/IMDG_EN/imdg_2023_-_en_part{n}.pdf"
      first:
        description: "First part number"
        required: true
        default: "1"
      last:
        description: "Last part number"
        required: true
        default: "2900"
      limit:
        description: "Stop after N parts (0 = no limit). Use a small number for a trial run."
        required: false
        default: "0"
      dry_run:
        description: "Identify only, commit nothing"
        type: boolean
        required: false
        default: true
      delay:
        description: "Seconds between requests"
        required: false
        default: "0.4"

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # ~2900 downloads at 0.4s plus parsing; the default 6 hours is plenty, but be explicit.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymupdf

      - name: Fetch and identify
        run: |
          python scripts/fetch_un_cards.py \
            --base-url "${{ inputs.base_url }}" \
            --first "${{ inputs.first }}" \
            --last "${{ inputs.last }}" \
            --limit "${{ inputs.limit }}" \
            --delay "${{ inputs.delay }}" \
            --out un_cards \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Summarise
        if: ${{ !inputs.dry_run }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.loads(pathlib.Path("un_cards/manifest.json").read_text())
          s = m["summary"]
          print("## UN cards fetched\n")
          print(f"- Parts seen: **{s['parts_seen']}**")
          print(f"- Identified: **{s['identified']}**")
          print(f"- Unique UN numbers: **{s['unique_un_numbers']}**\n")
          print("| Outcome | Count |")
          print("|---|---|")
          for key, value in s["counts"].items():
              print(f"| {key} | {value} |")
          unknown = [p for p, r in m["parts"].items() if not r.get("un") and r["status"] != "absent"]
          if unknown:
              print(f"\n### Needs a manual look ({len(unknown)})\n")
              for part in unknown[:50]:
                  print(f"- `{part}` — {m['parts'][part].get('note', '')}")
              if len(unknown) > 50:
                  print(f"- … and {len(unknown) - 50} more, see `un_cards/manifest.json`")
          PY

      - name: Open a pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/un-cards
          delete-branch: true
          commit-message: "Add the UN cards, named by UN number"
          title: "Add the UN cards, named by UN number"
          body: |
            Fetched by the **Fetch UN cards** workflow.

            Every document was opened and the UN number read from its contents,
            then verified against `backend/seed/dg/un_numbers.json`. Cards that
            could not be identified with confidence are in
            `un_cards/_unidentified/` rather than filed under a guessed number.

            See `un_cards/manifest.json` for what happened to each part, and the
            workflow run summary for the totals.
          add-paths: |
            un_cards/**
