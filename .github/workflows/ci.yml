name: CI

# Eén workflow op elke push en elke pull request. Dat was het niet.
#
# ci.yml en dockerhub.yml heetten allebei "CI" en draaiden allebei op push naar
# main en op elke pull request. Ze deden grotendeels hetzelfde werk: pytest liep
# twee keer, `npm ci` en de frontend-build liepen twee keer. Vijf checks per
# duw, waarvan twee een kopie van twee andere. Bij een release met drie commits
# op de branch waren dat vijftien jobs voordat er ook maar iets gemerged was.
#
# De tweede kostenpost was de Docker-build. Die bouwde linux/amd64 én
# linux/arm64, en arm64 draait op een amd64-runner onder QEMU-emulatie: dat is
# waar de vijf tot negen minuten heen gingen. Op een pull request werd het
# resultaat daarna weggegooid, want pushen gebeurt daar niet.
#
# Dus: één workflow, elke stap één keer, en arm64 alleen wanneer er ook
# werkelijk een image wordt gepubliceerd. Op een pull request is de Docker-build
# een rooktest — bouwt het Dockerfile nog? — en daarvoor volstaat amd64.
#
# Op een tag draait dit niet. De image van een release wordt niet opnieuw
# gebouwd maar hernoemd: `tag-release.yml` zet de versietag met
# `imagetools create` op het manifest dat hier op main is gebouwd en gepusht.
# Dat scheelt een tweede vertaling van dezelfde commit, en het is strenger —
# wat wordt uitgebracht is bit voor bit wat hier groen werd.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Wie drie keer achter elkaar duwt, hoeft niet drie keer de uitslag van de
# eerste twee. Op main en op een tag draait alles af: daar hangt een publicatie
# aan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt

      # Deze poort staat bewust vóór de installatie: hij kost een seconde en
      # vangt de fout die de release-workflow vroeger op main repareerde.
      - name: Check version consistency
        run: python scripts/check_versions.py

      - run: pip install -r backend/requirements.txt

      - name: Validate installed Python dependencies
        run: pip check

      # DATA_DIR en DATABASE_URL wijzen standaard naar /data en dat bestaat hier
      # niet; de backend zaait zijn catalogi bij het opstarten in die map.
      - name: Tests
        working-directory: backend
        env:
          DATA_DIR: ${{ github.workspace }}/data
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          APP_ENV: test
          APP_SECRET_KEY: ci-secret
          CATALOG_AUTO_SYNC: "false"
        run: |
          mkdir -p "${{ github.workspace }}/data"
          python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 verlangt "^22.22.2 || ^24.15.0 || >=26" en undici 8 ">=22.19.0".
          # Op Node 20 valt `npm test` om nog voordat er één test draait, met
          # "webidl.util.markAsUncloneable is not a function" uit undici.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Op een pull request wordt er niets gepusht, dus hoeft er ook geen arm64
      # te worden gebouwd. Dat scheelt het leeuwendeel van de looptijd: arm64
      # gaat hier door QEMU heen.
      - name: Decide what to build
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "publishing=false" >> "$GITHUB_OUTPUT"
            # Een pull request schrijft geen cache. Zou hij dat wel doen, dan
            # overschreef een amd64-only laag die van main en werd de volgende
            # publicerende build juist langzamer.
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "publishing=true" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max,scope=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Check DockerHub credentials
        id: dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          TOKEN="${DOCKER_TOKEN:-$DOCKER_PASSWORD}"
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_USERNAME en DOCKER_TOKEN zijn niet ingesteld. De image wordt wel gebouwd maar niet naar DockerHub gepusht."
          fi

      # QEMU is er alleen voor het emuleren van arm64. Zonder arm64 is het
      # opzetten ervan verspilde tijd.
      - name: Set up QEMU
        if: steps.plan.outputs.publishing == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: steps.plan.outputs.publishing == 'true' && steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jeffersonmouze/cargopilot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.plan.outputs.platforms }}
          push: ${{ steps.plan.outputs.publishing == 'true' && steps.dockerhub.outputs.configured == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=main
          cache-to: ${{ steps.plan.outputs.cache_to }}
