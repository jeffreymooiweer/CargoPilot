name: Probe NHM sources

# Verkenning van openbare bronnen voor de NHM-goederencodes (CIM vak 24).
# Legt niets vast: zij meet of een bron bereikbaar is, of hij zescijferige
# codes mét omschrijving levert, en of dat genoeg is om een keuzelijst op te
# bouwen. Zescijferige codes verzinnen is hier geen optie — de vervoerder
# rekent er zijn tarief mee en de douane leest hem.
#
# Draait hier en niet lokaal omdat de ontwikkelomgeving geen uitgaand netwerk
# heeft. Zie scripts/probe_nhm_sources.py.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Eén eigen bron beproeven in plaats van de kandidatenlijst"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            python scripts/probe_nhm_sources.py --url "${{ inputs.url }}"
          else
            python scripts/probe_nhm_sources.py
          fi
