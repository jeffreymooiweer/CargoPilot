name: CI

# Draait op elke push en elke pull request naar main. Tot nu toe waren de
# workflows in deze repo gericht op uitgeven (Docker Hub, tags, releases) en op
# het ophalen van gegevens; de tests draaiden alleen lokaal. Daardoor kon een
# versiebump of een gebroken test tot aan de release meegaan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt

      - name: Check version consistency
        run: python scripts/check_versions.py

      - run: pip install -r backend/requirements.txt

      - name: Validate installed Python dependencies
        run: pip check

      # DATA_DIR en DATABASE_URL wijzen standaard naar /data en dat bestaat hier
      # niet; de backend zaait zijn catalogi bij het opstarten in die map.
      - name: Tests
        working-directory: backend
        env:
          DATA_DIR: ${{ github.workspace }}/data
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          APP_ENV: test
          APP_SECRET_KEY: ci-secret
          CATALOG_AUTO_SYNC: "false"
        run: |
          mkdir -p "${{ github.workspace }}/data"
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 verlangt "^22.22.2 || ^24.15.0 || >=26" en undici 8 ">=22.19.0".
          # Op Node 20 valt `npm test` om nog voordat er één test draait, met
          # "webidl.util.markAsUncloneable is not a function" uit undici. Deze
          # job stond daardoor sinds zijn invoering rood, ook op main.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
